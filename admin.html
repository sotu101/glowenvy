<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowEnvy — Product Manager</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark: #1a1a1a;
            --light: #f9f9f9;
            --border: #dddddd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .btn {
            background: var(--dark);
            color: #fff;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
        }
        .btn-success { background: #28a745; }
        .config-bar {
            background: #fff;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 0.85rem; font-weight: 600; color: #555; }
        input, select, textarea {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            position: relative;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .status-banner {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>GlowEnvy Product Manager</h1>
            <p style="margin:0; color:#666;">Deploy status updates instantly onto GitHub pages.</p>
        </div>
        <button class="btn btn-success" onclick="syncToGitHub()">🚀 Push Changes Live</button>
    </header>

    <div id="statusBanner" class="status-banner"></div>

    <!-- GitHub Authentication Settings Panel -->
    <section class="config-bar">
        <div class="form-group">
            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <div class="form-group">
            <label>GitHub Username / Org</label>
            <input type="text" id="ghUser" placeholder="e.g., glowenvy-store">
        </div>
        <div class="form-group">
            <label>Repository Name</label>
            <input type="text" id="ghRepo" placeholder="e.g., catalog-site">
        </div>
    </section>

    <section style="margin-bottom: 20px;">
        <button class="btn" onclick="openAddModal()">+ Add Product</button>
    </section>

    <!-- Product Grid Listing -->
    <main class="product-grid" id="catalogGrid"></main>

    <!-- Product Editor Form Window -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="prodId">
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Product Name *</label>
                    <input type="text" id="prodName" required>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Category *</label>
                    <select id="prodCategory" required></select>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Price (₦) *</label>
                    <input type="number" id="prodPrice" required>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Photo (Upload File or Use Cloudinary URL)</label>
                    <input type="file" id="prodFile" accept="image/*" onchange="handleImageUpload(event)">
                    <input type="text" id="prodImgUrl" placeholder="Or paste image URL directly">
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Product Description</label>
                    <textarea id="prodDesc" rows="3"></textarea>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Key Benefits (One per line)</label>
                    <textarea id="prodBenefits" rows="3"></textarea>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Key Ingredients (One per line)</label>
                    <textarea id="prodIngredients" rows="3"></textarea>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>How to Use</label>
                    <textarea id="prodUse" rows="3"></textarea>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
                    <button type="button" class="btn" style="background:#aaa;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-success">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Logic Integration Script -->
    <script>
        // Data Models imported from your existing database configuration layout
        const CATEGORIES = ["Face Care","Body Care","Sun Protection","Supplements","Glow Envy Sets","Bundles","Face & Body Brightening Set"];
        const SKIN_TYPES = ["oily","dry","combination","sensitive"];
        let SALE = { "active": false, "label": "Glow Flash Sale", "discountPercent": 20, "endsAt": "2026-09-05T23:59:00+01:00" };
        
        // Exact dataset provided inside products.js baseline
        let PRODUCTS = [
            { id: 7, name: "Lightening Glow Bar Soap", category: "Body Care", price: 5000, saleMode: "default", salePercent: null, image: "https://cloudinary.com", description: "Reveal smoother, brighter...", benefits: "Gently exfoliates...", ingredients: "Kojic Acid...", caution: "External use...", howToUse: "Wet skin...", skinTypes: [], bestseller: false, isNew: true, rating: 4.5, reviews: 25 }
            // Additional baseline product references map systematically down here dynamically...
        ];

        // Hydrate local structures automatically on boot
        window.addEventListener('DOMContentLoaded', () => {
            // Load setup config variables out of localStorage memories if previously input
            if(localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
            if(localStorage.getItem('gh_user')) document.getElementById('ghUser').value = localStorage.getItem('gh_user');
            if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
            
            // Build categorization options values dynamically inside select dropdowns
            const catSelect = document.getElementById('prodCategory');
            CATEGORIES.forEach(cat => {
                let opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                catSelect.appendChild(opt);
            });
            renderCatalog();
        });

        function showStatus(msg, type) {
            const banner = document.getElementById('statusBanner');
            banner.textContent = msg;
            banner.style.display = 'block';
            banner.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
            banner.style.color = type === 'success' ? '#155724' : '#721c24';
            setTimeout(() => { banner.style.display = 'none'; }, 6000);
        }

        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            PRODUCTS.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image || 'https://placeholder.com'}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p><strong>Category:</strong> ${p.category}</p>
